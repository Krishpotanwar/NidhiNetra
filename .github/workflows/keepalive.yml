# Render's free tier spins the API down after ~15 minutes with no traffic
# and takes 30-60+ seconds to wake on the next request -- comfortably past
# the frontend's 20-second fetch timeout (05-App/web/lib/api-client.ts).
# A visitor who hits a cold instance sees a slow load or, if they happen to
# click "Refresh now" at that moment, a failed refresh (2026-09-13 incident).
# Pinging the zero-I/O /health endpoint often enough that the service never
# goes idle for 15 minutes keeps it permanently warm, for free.
name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -sf --max-time 30 https://nidhinetra-api.onrender.com/health
