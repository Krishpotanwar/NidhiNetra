openapi: 3.0.3
info:
  title: NidhiNetra API
  version: 0.1.0
  description: >
    Execution Plan section 3.4. Authority note (eng review task T21): this
    hand-written file is the authoritative contract until CP4 (API serving
    real data). From CP4 onward, FastAPI's own generated openapi.json is
    authoritative, because it is derived from the actual route code and
    cannot drift from what the API really does. This file stops being edited
    at that point and is kept only as the pre-implementation design record.

paths:
  /api/works:
    get:
      summary: Paginated risk-scored works, sorted by inspection_rank
      parameters:
        - name: state
          in: query
          schema: { type: string }
        - name: year
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: flag
          in: query
          schema: { type: string }
        - name: vendor_id
          in: query
          schema: { type: string }
        - name: district_authority
          in: query
          schema: { type: string, maxLength: 200 }
        - name: constituency
          in: query
          schema: { type: string, maxLength: 120 }
        - name: pendency
          in: query
          description: One of the three MoSPI pendency checks (T4). 503 if the snapshot has no as-of date yet.
          schema: { type: string, enum: [late_sanction, open_past_one_year, no_payment_90_days] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: >
            Sorted by inspection_rank ascending, always. Filters narrow the set, never change the sort.
            Each row also carries days_to_sanction and days_since_sanction (T4), both nullable.

  /api/works/{work_id}:
    get:
      summary: Full detail for one work
      parameters:
        - name: work_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: One normalized + scored record, merged }
        "404": { description: work_id not found in the current snapshot }

  /api/graph:
    get:
      summary: Fund-flow graph subset (conditional on M5 -- see Design Review - Data Spike First)
      parameters:
        - name: agency
          in: query
          schema: { type: string }
        - name: vendor
          in: query
          schema: { type: string }
      responses:
        "200": { description: fund_flow_graph.schema.json subset }

  /api/stats/summary:
    get:
      summary: The four summary-strip figures
      responses:
        "200":
          description: >
            works_under_implementation, flagged_count, total_flagged_amount_inr,
            idle_beyond_12_months_amount_inr, plus data_as_of (ISO 8601 timestamp
            of the last successful pull -- see plan section 3.1, the live-data diagram)

  /api/pendency:
    get:
      summary: The three MoSPI monthly pendency checks, scoped to works under implementation (T4)
      description: >
        Scope-only: no paging, no free-text search, no flag/category/vendor filter (those stay on
        /api/works). district_authority and constituency narrow to one authority or seat; group_by
        breaks the three checks down by state, district_authority or constituency.
      parameters:
        - name: state
          in: query
          schema: { type: string }
        - name: district_authority
          in: query
          schema: { type: string, maxLength: 200 }
        - name: constituency
          in: query
          schema: { type: string, maxLength: 120 }
        - name: group_by
          in: query
          schema: { type: string, enum: [state, district_authority, constituency] }
      responses:
        "200":
          description: >
            as_of, population_n, population_inr, kinds (late_sanction, open_past_one_year,
            no_payment_90_days -- each a count and a sanctioned amount; late_sanction also carries
            median_days_to_sanction), district_authority_n, quota_sum (sum of each District
            Authority's own quota in scope), third_party (at_or_above_25_lakh,
            between_15_and_25_lakh, required_n), groups (null unless group_by is set).
        "503": { description: The snapshot has no as-of date yet }

  /api/duplicates:
    get:
      summary: Phase 1 Stage C/D-lite review queue for duplicate-work candidates
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed_same, rejected_different]
            default: pending
        - name: kind
          in: query
          description: >
            T12B.7: narrows by finder. identical covers identical_batch and
            district_identical_batch; judged covers judged_same_asset_same_place, a model-read
            near-copy pair. Omitted matches every kind.
          schema: { type: string, enum: [identical, judged] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: >
            Ordered by candidate_id ascending, always. meta.total is the status-and-kind-filtered
            total.
        "422": { description: Unknown status or kind }

  /api/refresh:
    post:
      summary: Manual "refresh now" trigger
      description: >
        Debounced client-side and rate-limited server-side (eng review task T12).
        Times out into a stated refresh_failed state rather than hanging (task T13).
      responses:
        "202": { description: Refresh started }
        "429": { description: Refresh already in progress or requested too recently }
