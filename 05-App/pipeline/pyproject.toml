[project]
name = "nidhinetra-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "httpx>=0.27",
    "pydantic>=2.8",
    "jsonschema>=4.0",
    # Added by A4 (api) for build_snapshot.py, the only pipeline/ file A4 owns
    # (see 05-App/api/README scope note). Needed for DataFrame.to_parquet /
    # pd.read_parquet -- pandas has no parquet engine of its own.
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nidhinetra_pipeline"]
