[project]
name = "nidhinetra-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.0",
    "pydantic>=2.8",
    # A4: main.py bootstraps the snapshot on startup and /api/refresh
    # re-runs it, both by importing nidhinetra_pipeline.build_snapshot
    # directly (in-process), not shelling out. Resolved from the uv
    # workspace, not PyPI -- see [tool.uv.sources] below.
    "nidhinetra-pipeline",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv.sources]
nidhinetra-pipeline = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nidhinetra_api"]
